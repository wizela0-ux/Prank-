<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUBG AI Skill Analyzer 🎮</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #1e1e1e;
      border: 2px solid #f39c12;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 0 25px rgba(243, 156, 18, 0.25);
    }

    h1 {
      color: #f1c40f;
      font-size: 22px;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 15px;
      margin-bottom: 15px;
      outline: none;
      text-align: center;
    }

    input:focus {
      border-color: #f39c12;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #f39c12;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #e67e22;
      transform: scale(1.02);
    }

    /* Loading Bar Style */
    .loading-box {
      display: none;
      margin-top: 10px;
    }

    .progress-bg {
      background: #333;
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      margin: 15px 0;
      border: 1px solid #555;
    }

    .progress-bar {
      background: linear-gradient(90deg, #f1c40f, #e67e22);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
    }

    .status-text {
      color: #f1c40f;
      font-size: 14px;
      font-weight: 500;
    }

    /* Result Box Style */
    .result-box {
      display: none;
      animation: popIn 0.5s ease;
    }

    .bot-badge {
      background: #e74c3c;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 30px;
      display: inline-block;
      margin: 15px 0;
      box-shadow: 0 4px 10px rgba(231, 76, 60, 0.4);
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Step 1: Input Form -->
    <div id="step1">
      <div style="font-size: 50px; margin-bottom: 10px;">🤖</div>
      <h1>PUBG AI Skill Analyzer</h1>
      <p class="subtitle">የእርስዎን K/D Ratio እና የጨዋታ ችሎታ በ AI ይገምግሙ</p>
      <input type="text" id="pubgId" placeholder="PUBG ID or Character Name...">
      <button onclick="startAnalysis()"> Analyze </button>
    </div>

    <!-- Step 2: Fake Progress Loading -->
    <div id="loading" class="loading-box">
      <div style="font-size: 40px; margin-bottom: 10px;">🔍</div>
      <p id="status" class="status-text">መረጃውን በማሰስ ላይ...</p>
      <div class="progress-bg">
        <div id="bar" class="progress-bar"></div>
      </div>
    </div>

    <!-- Step 3: Prank Result -->
    <div id="result" class="result-box">
      <div style="font-size: 60px;">🤖😂</div>
      <div class="bot-badge">99.9% PRO BOT!</div>
      <h2 style="color: #f1c40f; margin-bottom: 10px;">ውጤት፡ ትልቅ ቦት ነህ!</h2>
      <p style="color: #ddd; font-size: 15px; line-height: 1.6;">
        AI አካውንትህን መርምሮ በ PUBG ታሪክ ውስጥ ካሉት አስደናቂ ቦቶች አንዱ መሆንህን አረጋግጧል! 😂
      </p>
      <button onclick="location.reload()" style="margin-top: 20px; background: #444; color: #fff;">እንደገና ሞክር</button>
    </div>
  </div>

  <script>
    function startAnalysis() {
      const idInput = document.getElementById('pubgId').value.trim();
      if(!idInput) {
        alert('Enter PUBG ID or Name !');
        return;
      }

      document.getElementById('step1').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      const bar = document.getElementById('bar');
      const status = document.getElementById('status');

      const steps = [
        { percent: 25, text: "K/D ratio እና Matches በማሰስ ላይ..." },
        { percent: 55, text: "Headshot percentage በመፈተሽ ላይ..." },
        { percent: 85, text: "የአጫወት ስታይል በ AI በማስላት ላይ..." },
        { percent: 100, text: "ውጤቱ ተዘጋጅቷል!" }
      ];

      let index = 0;
      const interval = setInterval(() => {
        if (index < steps.length) {
          bar.style.width = steps[index].percent + '%';
          status.innerText = steps[index].text;
          index++;
        } else {
          clearInterval(interval);
          setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('result').style.display = 'block';
          }, 600);
        }
      }, 900);
    }
  </script>

</body>
</html>
