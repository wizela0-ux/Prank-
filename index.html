<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bot verification?</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 350px;
      width: 90%;
      position: relative;
    }

    .emoji {
      font-size: 60px;
      margin-bottom: 15px;
      animation: bounce 1.5s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      /* gap: 20px;  ተመሳሳይ መጠን እንዲኖራቸው ክፍተቱን አጥፍቼአለሁ */
      position: relative;
      min-height: 50px;
    }

    button {
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    #yesBtn {
      background-color: #ff4b2b;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
      width: 140px; /* ተመሳሳይ መጠን እንዲኖራቸው ስፋቱን ወስኛለሁ */
    }

    #yesBtn:hover {
      transform: scale(1.1);
      background-color: #e63d21;
    }

    #noBtn {
      background-color: #e0e0e0;
      color: #333;
      position: absolute;
      right: 20px;
      transition: all 0.15s ease-out;
      width: 140px; /* ተመሳሳይ መጠን እንዲኖራቸው ስፋቱን ወስኛለሁ */
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="emoji">✅</div>
    <h1>እኔ ቦት ነኝ</h1>
    <div class="btn-group">
      <button id="yesBtn">አዎ!</button>
      <button id="noBtn">አይደለሁም</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const card = document.getElementById('card');

    // "No" በተኑን የሚያሸሸው ተግባር
    function moveButton() {
      // የስክሪኑን ስፋትና ቁመት ወሰን ማወቅ
      // በተኑ ስክሪኑ ዳር ላይ እንዳይደርስ 30px padding ጨምሬአለሁ
      const maxX = window.innerWidth - noBtn.offsetWidth - 30;
      const maxY = window.innerHeight - noBtn.offsetHeight - 30;

      // በዘፈቀደ (Random) ቦታ ማውጣት
      // በተኑ በዘፈቀደ ቦታ ሲንቀሳቀስ መጠኑ እንዳይጨምር ለማድረግ maxX እና maxY ስሌት አሻሽዬአለሁ
      const randomX = Math.max(10, Math.floor(Math.random() * maxX) + 15);
      const randomY = Math.max(10, Math.floor(Math.random() * maxY) + 15);

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    // ለኮምፒውተር (Mouse Hover)
    noBtn.addEventListener('mouseover', moveButton);

    // ለስልክ touch (እንዳይነካ ወዲያው ያሸሻል)
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveButton();
    });

    // "Yes" ሲነካ የሚመጣው መልስ
    yesBtn.addEventListener('click', () => {
      card.innerHTML = `
        <div class="emoji">😂</div>
        <h1 style="color: #ff4b2b;">አይ አንተ ቦት ኣቃለዉ እኮ</h1>
        <p style="color: #555; font-size: 16px;">በቃ አይዞህ ኣንድ ቀን ትለምዳለህ</p>
      `;
    });
  </script>

</body>
</html>
